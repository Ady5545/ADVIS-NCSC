name: A.D.V.I.S. validation

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "advis-validation-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Catalog, learning contracts, TypeScript and production build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate serverless API syntax
        run: node --check api/advis.js && node --check api/history.js

      - name: Validate model catalog and CAD evidence
        run: npm run validate:catalog

      - name: Validate scientific claim metadata and simulation limits
        run: npm run validate:science

      - name: Validate advertised model capabilities
        run: npm run validate:capabilities

      - name: Test cross-device Nebula Core rendering and adaptive quality
        run: npm run test:core-rendering

      - name: Validate lesson catalog and assessment integrity
        run: npm run validate:lessons

      - name: Test deterministic simulation contract
        run: npm run test:simulation

      - name: Test staged explosion transform contract
        run: npm run test:explosion

      - name: Test safe innovation study import and export
        run: npm run test:study-project

      - name: Test model-grounded tutor context and capability boundaries
        run: npm run test:tutor-context

      - name: Test guided lesson progress persistence and resume
        run: npm run test:lesson-progress

      - name: Test editable workshop command and storage contract
        run: npm run test:workshop

      - name: Test domain learning model contracts
        run: npm run test:domains

      - name: Test engine kinematics reference vectors
        run: npm run test:kinematics

      - name: TypeScript validation
        run: npx tsc --noEmit --pretty false

      - name: Build Vite application
        env:
          VITE_ADVIS_API_BASE_URL: ${{ vars.VITE_ADVIS_API_BASE_URL }}
        run: npm run build

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run browser startup and narrow-viewport smoke tests
        run: npm run test:e2e
